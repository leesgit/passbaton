name: CI

# ⚠ 예전 판은 `paths: tools/project-manager-mcp/**` 에만 걸려 있었는데 이 레포에 그 경로가 없다 —
#   CI 가 한 번도 돌지 않았다(2026-10-15 발견). 레포 루트 기준으로 다시 썼다.
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  # 역검증(Astra reply-148 PB148-01): 대소문자 구분 FS 에서만 도는 라우팅 경계 시험이 옛 구현을 실제로 잡는가
  boundary-mutation:
    name: boundary mutation (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      # 시험 파일은 CI 에서 dist/ 가 없으면 바로 던진다 — 첫 실행(c02c23c)이 그래서 빨갰다
      - name: Build
        run: npm run build
      - name: Normal green → mutated red → restored green
        run: node scripts/mutation-boundary.mjs

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]   # engines: >=22 (better-sqlite3 프리빌드가 있는 판)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 레포에 lockfile 이 없어 npm ci 를 못 쓴다. 이 install 은 우리 postinstall 도 돌린다 —
      # dist 가 아직 없으니 래퍼가 「did NOT complete」 경고만 남기고 0 으로 끝나야 한다(A 의 실전 확인).
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # 배포 판정: 실제 tarball → 기본 설정 전역 설치 → 훅·MCP·SQLite (임시 prefix·HOME)
      # 아래 판정들은 Tests 가 빨개도 돈다(작업은 빨강 그대로) — 기존 테스트 실패가 배포 판정을 가리지 않게
      - name: verify-pack (bundled npm)
        if: success() || failure()
        run: node scripts/verify-pack.mjs

      # 역검증: 옛 postinstall 문자열로 포장하면 빨개져야 한다. POSIX sh 에서는 옛 줄이 정상 동작하므로 Windows 만.
      - name: verify-pack --break=shell (reverse check)
        if: (success() || failure()) && runner.os == 'Windows'
        run: node scripts/verify-pack.mjs --break=shell

      # --strict · --recover 는 게이트가 아니다(Astra P3): Windows 로컬에서 통과, README 명령은 레지스트리 판으로 이름 매칭 확인.
      #   Linux CI 의 --strict 는 `npm error enoent` 로 실패했다 — 원인 미확인·비게이트로 기록만(무해하다고 단정하지 않는다).
